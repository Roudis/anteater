# Floci — local AWS emulator. Pinned by digest per course policy: never track
# :latest in delivered material. This is the exact image POC-01 verified the
# Acme Health exercise-1 stacks apply cleanly against.
services:
  floci:
    image: floci/floci@sha256:eab36252ea43a4a73928423f0372219052c5c6f87207f6c4754db14b91d6ed30
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # required: Lambda, RDS, EC2
      - ./data:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
      # NOTE: the `test` access key and any UNKNOWN key bypass IAM enforcement
      # once a later exercise does live IAM testing.
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "true"

  backend:
    build:
      context: ./tool
    ports:
      - "8000:8000"
    environment:
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      - floci

  frontend:
    build:
      context: ./webapp
    ports:
      - "8080:80"
    depends_on:
      - backend
